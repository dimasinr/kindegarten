{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Monitoring Nilai Siswa</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .signup-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 460px;
            padding: 40px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            text-align: center;
        }

        /* BINUS Shield Logo Style */
        .binus-logo {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-shield {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #10b981 0%, #eab308 50%, #ef4444 100%);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .logo-school-name {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .logo-ib-world {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .signup-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-light);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-light);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        .signup-btn:hover {
            background-color: #2563eb;
        }

        .login-link {
            display: block;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .login-link a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Message Box */
        .messages-box {
            margin-bottom: 20px;
            text-align: left;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .message-error {
            background-color: #fee2e2;
            color: #991b1b;
            border-left: 4px solid var(--danger);
        }

        .message-success {
            background-color: #d1fae5;
            color: #065f46;
            border-left: 4px solid var(--success);
        }
    </style>
</head>
<body>

    <div class="signup-card">
        <!-- Logo -->
        <div class="binus-logo">
            <img src="{% static 'monitoring/logo_tk.png' %}" alt="BINUS SCHOOL Logo" style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 10px;">
            <div class="logo-school-name">BINUS SCHOOL</div>
            <div class="logo-ib-world">IB World School</div>
        </div>

        <h2 class="signup-title">Create a new account</h2>

        <!-- Alert messages -->
        {% if messages %}
            <div class="messages-box">
                {% for message in messages %}
                    <div class="message message-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                        <i class="fa-solid {% if message.tags == 'error' %}fa-circle-xmark{% else %}fa-circle-check{% endif %}"></i>
                        <span>{{ message.message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" class="form-control" required>
                    <option value="1">Guru</option>
                    <option value="2">Ortu</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="signup-btn">Sign up</button>
        </form>

        <span class="login-link">Already have an account? <a href="{% url 'login' %}">Sign in</a></span>
    </div>

</body>
</html>
